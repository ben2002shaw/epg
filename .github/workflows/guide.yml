name: Build US guide

on:
  schedule:
    - cron: "0 8 * * *"   # runs daily at 08:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Grab guide
        run: |
          npm run grab --- \
            --sites=i.mjh.nz,tvtv.us,tvpassport.com,watchyour.tv,watch.whaletvplus.com \
            --output=guide.xml \
            --gzip \
            --days=3 \
            --maxConnections=10 \
            --timeout=15000
        continue-on-error: true

      - name: Commit guide
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f guide.xml guide.xml.gz
          git commit -m "update guide $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
