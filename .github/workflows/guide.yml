name: Build US guide

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Grab guide
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          npm run grab --- \
            --channels=us.channels.xml \
            --output=guide.xml \
            --gzip
        continue-on-error: true

      - name: Commit guide
        run: |
          if [ ! -s guide.xml ]; then
            echo "guide.xml was not produced - the grab step failed. Nothing to commit."
            exit 1
          fi
          ls -lh guide.xml guide.xml.gz || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f guide.xml guide.xml.gz
          git commit -m "update guide $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
